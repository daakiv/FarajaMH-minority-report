# Partial v9.1 prototype with a guided single-reviewer screen.
# See docs/WORKFLOW.md and docs/ALIGNMENT.md before interpreting role/resource gates.
# Paths are relative to this file. Never put credentials or licensed release files in this repository.
mode: fixture  # fixture = deterministic/no network; local = loopback Ollama + OWL/RF2; connected = explicit remote access
storage: work/research.sqlite
output: work/outputs
fixtures: pilot/model_responses.json
prompt: farajamh/prompts/interpret-v1.md
voting:
  minimum_primary_votes: 3
  grouping_version: semantic-frame-conservative-v1
  # Reviewed paraphrase aliases only. Empty by default; no automatic cross-cultural equivalence.
  aliases: {}
review:
  workflow: single_reviewer  # Guided UI: one trained reviewer, separate recorded sign-offs
  minimum_reviewers: 2  # Retained only for legacy CLI review/adjudicate commands
  ckb_requires_arbitration: true  # Legacy CLI policy; guided review uses explicit human approval
risk:
  priority_signals: [flagged, uncertain]
  terms: [suicide, self-harm, kill myself, kujidhuru, kujiua]
network:
  allowed_origins: ["http://127.0.0.1:11434", "https://www.ebi.ac.uk"]
  timeout_seconds: 120
models:
  # Fixture identities are not claims these models have run. Set provider: ollama for an explicit local run.
  - {id: small-qwen, provider: fixture, model: "qwen2.5:3b", endpoint: "http://127.0.0.1:11434", settings: {temperature: 0, seed: 11}}
  - {id: small-llama, provider: fixture, model: "llama3.2:3b", endpoint: "http://127.0.0.1:11434", settings: {temperature: 0, seed: 12}}
  - {id: medium-gemma, provider: fixture, model: "gemma3:4b", endpoint: "http://127.0.0.1:11434", settings: {temperature: 0, seed: 13}}
  - {id: comparison-qwen, provider: fixture, model: "qwen2.5:14b", endpoint: "http://127.0.0.1:11434", settings: {temperature: 0, seed: 14}}
terminology:
  MFOEM:
    enabled: true
    adapter: owl  # owl or ols in real modes
    index: work/mfoem.sqlite
    endpoint: https://www.ebi.ac.uk/ols4/api
    ontology: mfoem
    release: REQUIRED_FROM_AUTHORIZED_RESOURCE
  MFOMD:
    enabled: true
    adapter: owl
    index: work/mfomd.sqlite
    endpoint: https://www.ebi.ac.uk/ols4/api
    ontology: mfomd
    release: REQUIRED_FROM_AUTHORIZED_RESOURCE
  SNOMED_CT:
    enabled: true  # Mandatory. Missing RF2 blocks complete terminology review and release.
    adapter: rf2
    index: work/snomed.sqlite
    edition: REQUIRED_EDITION_URI
    release: REQUIRED_YYYYMMDD
    language_refset: "900000000000509007"  # Example US English; choose an authorized release's refset explicitly
identities:
  # Tokens are resolved from env, never from submitted role/identity fields. All example accounts are SIMULATED.
  demo_ke:
    roles: [reviewer, curator, terminology]
    token_env: FARAJA_DEMO_KE_TOKEN
    simulated: true
    expertise: ["SIMULATED language and cultural reviewer"]
    locality_familiarity: "SIMULATED Kenyan Kiswahili familiarity"
  demo_tz:
    roles: [reviewer]
    token_env: FARAJA_DEMO_TZ_TOKEN
    simulated: true
    expertise: ["SIMULATED clinical and lived-experience reviewer"]
    locality_familiarity: "SIMULATED Tanzanian Kiswahili familiarity"
  demo_arbitrator:
    roles: [arbitrator]
    token_env: FARAJA_DEMO_ARBITRATOR_TOKEN
    simulated: true
    expertise: ["SIMULATED contextual adjudicator"]
    locality_familiarity: "SIMULATED Kenya/Tanzania review panel"
  demo_curator:
    roles: [curator, terminology]
    token_env: FARAJA_DEMO_CURATOR_TOKEN
    simulated: true
    expertise: ["SIMULATED terminology curator"]
    locality_familiarity: "SIMULATED Kenya/Tanzania review panel"
exports:
  mapping_set_id: "https://example.org/farajamh/research/mappings"
  license: "https://creativecommons.org/licenses/by/4.0/"
  sssom_schema_version: "1.0"
  curie_map:
    FARAJA: "https://example.org/farajamh/sense/"
    reviewer: "https://example.org/farajamh/reviewer/"
    MFOEM: "http://purl.obolibrary.org/obo/MFOEM_"
    MFOMD: "http://purl.obolibrary.org/obo/MFOMD_"
    SNOMEDCT: "http://snomed.info/id/"
    FIXTURE: "https://example.org/farajamh/fictional-term/"
    skos: "http://www.w3.org/2004/02/skos/core#"
    semapv: "https://w3id.org/semapv/vocab/"
